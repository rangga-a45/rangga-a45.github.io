<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>IF ONLY YOU KNEW</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Roboto',system-ui,sans-serif; }
  body {
    background:#0a0d12;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
  }
  #game-container {
    width:100%;
    max-width:720px;
    height:94vh;
    max-height:860px;
    background:#0b141a;
    border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.04);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  .wa-header {
    background:#1f2c34;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
    border-bottom:1px solid #0b141a;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
    z-index:5;
  }
  .wa-avatar {
    width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg,#4a6b8a,#2c3e50);
    display:flex; align-items:center; justify-content:center;
    color:#d0e0f0; font-weight:600; font-size:1rem;
    flex-shrink:0;
    border:1.5px solid #3a5068;
  }
  .wa-header-info { flex:1; }
  .wa-header-info .name {
    color:#e9edef; font-size:1rem; font-weight:500; letter-spacing:0.3px;
  }
  .wa-header-info .status {
    color:#8696a0; font-size:0.72rem; margin-top:1px;
  }
  .wa-header-icons {
    display:flex; gap:18px; color:#aebac1; font-size:1.1rem;
  }

  #display-area {
    flex:1;
    overflow-y:auto;
    padding:16px 12px 12px 12px;
    background:#0b141a;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.012) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.01) 0%, transparent 40%);
    display:flex;
    flex-direction:column;
    gap:2px;
    scroll-behavior:smooth;
  }
  #display-area::-webkit-scrollbar { width:5px; }
  #display-area::-webkit-scrollbar-track { background:transparent; }
  #display-area::-webkit-scrollbar-thumb { background:#374045; border-radius:10px; }

  .chat-row {
    display:flex;
    width:100%;
    margin-bottom:3px;
    animation:popIn 0.3s ease-out;
  }
  @keyframes popIn {
    0% { opacity:0; transform:translateY(10px) scale(0.96); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  .chat-row.arka { justify-content:flex-start; }
  .chat-row.nadia { justify-content:flex-end; }
  .chat-row.narasi { justify-content:center; }
  .chat-row.timestamp { justify-content:center; }

  .bubble {
    max-width:82%;
    padding:8px 12px 8px 12px;
    border-radius:8px;
    font-size:0.92rem;
    line-height:1.45;
    word-break:break-word;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  .bubble.arka {
    background:#202c33;
    color:#e9edef;
    border-top-left-radius:2px;
  }
  .bubble.nadia {
    background:#005c4b;
    color:#e9edef;
    border-top-right-radius:2px;
  }
  .bubble.nadia .sender { color:#a7d8cc; }
  .bubble.narasi {
    background:#182229;
    color:#8fa3b3;
    font-style:italic;
    font-size:0.85rem;
    max-width:92%;
    text-align:center;
    border-radius:8px;
    padding:12px 14px;
    line-height:1.55;
    border:1px solid #1f2c34;
  }
  .bubble .sender {
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.3px;
    margin-bottom:2px;
    display:block;
    color:#7fa8b8;
  }
  .bubble .time {
    font-size:0.62rem;
    color:#8696a0;
    text-align:right;
    margin-top:3px;
    display:block;
    opacity:0.8;
  }

  .timestamp-badge {
    background:#182229;
    color:#8696a0;
    font-size:0.72rem;
    padding:5px 12px;
    border-radius:8px;
    text-align:center;
    box-shadow:0 1px 1px rgba(0,0,0,0.2);
    margin:6px 0;
  }

  .typing-indicator {
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:10px 14px;
    background:#202c33;
    border-radius:18px;
    width:fit-content;
    border-top-left-radius:2px;
    margin:4px 0;
  }
  .typing-indicator span {
    width:7px; height:7px; border-radius:50%;
    background:#8696a0;
    animation:typingBounce 1.3s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay:0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay:0.3s; }
  @keyframes typingBounce {
    0%,60%,100% { transform:translateY(0); opacity:0.5; }
    30% { transform:translateY(-5px); opacity:1; }
  }

  .header-typing {
    color:#00a884 !important;
    font-style:italic;
  }
  .header-typing::after {
    content:'';
    display:inline-block;
    animation:dots 1.4s steps(4,end) infinite;
    overflow:hidden;
    vertical-align:bottom;
    width:0;
  }
  @keyframes dots {
    0% { content:''; }
    25% { content:'.'; }
    50% { content:'..'; }
    75% { content:'...'; }
    100% { content:''; }
  }

  .typing-caret {
    display:inline-block;
    width:2px;
    height:1em;
    background:#e9edef;
    margin-left:2px;
    vertical-align:text-bottom;
    animation:caretBlink 0.7s step-end infinite;
  }
  @keyframes caretBlink {
    0%,50% { opacity:1; }
    51%,100% { opacity:0; }
  }

  .choice-container {
    display:flex;
    flex-direction:column;
    gap:7px;
    margin:10px 0 6px 0;
    animation:popIn 0.35s ease-out;
    width:100%;
    padding:0 4px;
  }
  .choice-btn {
    background:#1f2c34;
    border:1px solid #2f3d47;
    color:#d1d7db;
    padding:13px 16px;
    border-radius:10px;
    font-size:0.88rem;
    text-align:left;
    cursor:pointer;
    transition:all 0.18s ease;
    line-height:1.4;
    letter-spacing:0.2px;
  }
  .choice-btn:hover {
    background:#2a3942;
    border-color:#4a90a4;
    transform:translateX(3px);
  }
  .choice-btn:active { transform:translateX(1px) scale(0.99); }
  .choice-btn:disabled { opacity:0.45; pointer-events:none; }
  .choice-btn.next-btn {
    text-align:center;
    font-weight:600;
    background:#005c4b;
    border-color:#007a63;
    color:#e9edef;
  }
  .choice-btn.next-btn:hover {
    background:#007a63;
    transform:translateX(0) scale(1.01);
  }

  .game-footer {
    padding:10px 14px;
    background:#1f2c34;
    border-top:1px solid #0b141a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
    gap:8px;
    flex-wrap:wrap;
    z-index:5;
  }
  .footer-btn {
    background:#2a3942;
    border:1px solid #374045;
    color:#aebac1;
    padding:9px 16px;
    border-radius:8px;
    font-size:0.78rem;
    cursor:pointer;
    transition:all 0.2s;
    letter-spacing:0.3px;
  }
  .footer-btn:hover {
    background:#364147;
    color:#e9edef;
  }
  .footer-btn.primary {
    background:#005c4b;
    border-color:#007a63;
    color:#e9edef;
    font-weight:500;
  }
  .footer-btn.primary:hover { background:#007a63; }
  .music-indicator {
    display:flex; align-items:center; gap:7px;
    color:#8696a0; font-size:0.72rem;
  }
  .music-bars {
    display:flex; gap:2px; align-items:flex-end; height:14px;
  }
  .music-bars .bar {
    width:3px; background:#00a884; border-radius:2px;
    transition:height 0.15s;
  }
  .music-bars.playing .bar:nth-child(1) { animation:bar1 0.8s infinite ease-in-out; }
  .music-bars.playing .bar:nth-child(2) { animation:bar2 0.9s infinite ease-in-out; }
  .music-bars.playing .bar:nth-child(3) { animation:bar3 0.7s infinite ease-in-out; }
  .music-bars.playing .bar:nth-child(4) { animation:bar4 1.0s infinite ease-in-out; }
  @keyframes bar1 { 0%,100%{height:4px;} 50%{height:14px;} }
  @keyframes bar2 { 0%,100%{height:10px;} 50%{height:5px;} }
  @keyframes bar3 { 0%,100%{height:6px;} 50%{height:13px;} }
  @keyframes bar4 { 0%,100%{height:12px;} 50%{height:4px;} }

  .menu-screen {
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100%;
    padding:30px 20px;
    text-align:center;
    gap:14px;
    background:linear-gradient(160deg,#0b141a 0%,#111b21 100%);
  }
  .menu-title {
    font-size:2rem;
    font-weight:300;
    color:#e9edef;
    letter-spacing:3px;
    font-family:'Georgia',serif;
    font-style:italic;
    margin-bottom:4px;
    text-shadow:0 4px 20px rgba(0,168,132,0.15);
    line-height:1.3;
  }
  .menu-sub {
    color:#8696a0;
    font-size:0.82rem;
    margin-bottom:20px;
    max-width:340px;
    font-style:italic;
    line-height:1.6;
  }
  .menu-btn {
    background:#1f2c34;
    border:1px solid #2f3d47;
    color:#d1d7db;
    padding:15px 20px;
    border-radius:10px;
    font-size:0.95rem;
    cursor:pointer;
    transition:all 0.22s;
    width:100%;
    max-width:320px;
    letter-spacing:0.6px;
  }
  .menu-btn:hover {
    background:#2a3942;
    border-color:#00a884;
    transform:scale(1.02);
  }
  .menu-btn.secondary {
    background:transparent;
    border-color:#2f3d47;
    color:#8696a0;
    font-size:0.82rem;
    padding:11px 18px;
  }
  .menu-btn.secondary:hover { background:#182229; color:#aebac1; }

  .info-panel {
    background:#182229;
    border-radius:14px;
    padding:20px;
    border:1px solid #1f2c34;
    color:#aebac1;
    font-size:0.88rem;
    line-height:1.7;
    max-height:400px;
    overflow-y:auto;
    width:100%;
    text-align:left;
    box-shadow:inset 0 2px 8px rgba(0,0,0,0.4);
  }
  .info-panel h3 {
    color:#e9edef; font-weight:400; margin-bottom:12px;
    font-size:1.05rem; letter-spacing:0.5px;
  }
  .info-panel p { margin-bottom:10px; color:#9bb0c7; }
  .info-panel .contact {
    color:#00a884;
    background:#0b141a;
    padding:10px 14px;
    border-radius:8px;
    display:inline-block;
    margin-top:8px;
    font-family:monospace;
    letter-spacing:1px;
    border:1px solid #1f2c34;
  }

  .nav-row { display:flex; justify-content:center; margin-top:12px; width:100%; }
  .nav-btn {
    background:#1f2c34;
    border:1px solid #2f3d47;
    color:#aebac1;
    padding:10px 22px;
    border-radius:8px;
    font-size:0.8rem;
    cursor:pointer;
    transition:0.2s;
  }
  .nav-btn:hover { background:#2a3942; color:#e9edef; }

  .ending-badge {
    text-align:center;
    font-size:0.78rem;
    letter-spacing:3px;
    color:#00a884;
    text-transform:uppercase;
    margin:14px 0 6px 0;
    padding-top:14px;
    border-top:1px solid #1f2c34;
    font-weight:500;
  }

  @media (max-width:500px) {
    #game-container { height:98vh; border-radius:14px; }
    .menu-title { font-size:1.5rem; }
    .bubble { font-size:0.86rem; max-width:88%; }
    .choice-btn { font-size:0.82rem; padding:11px 13px; }
    .wa-header-info .name { font-size:0.9rem; }
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="game-container">
  <div class="wa-header">
    <div class="wa-avatar" id="headerAvatar">N</div>
    <div class="wa-header-info">
      <div class="name" id="headerName">Nadia</div>
      <div class="status" id="headerStatus">online</div>
    </div>
    <div class="wa-header-icons">
      <span>📞</span>
      <span>⋮</span>
    </div>
  </div>

  <div id="display-area"></div>

  <div class="game-footer">
    <div class="music-indicator">
      <div class="music-bars" id="musicBars">
        <div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <button id="musicToggleBtn" class="footer-btn" style="padding:6px 12px; font-size:0.7rem;">MUSIK ON</button>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="menuBtn" class="footer-btn">MENU</button>
      <button id="restartBtn" class="footer-btn primary">ULANGI</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ============================================================
  //  STATE
  // ============================================================
  let kedekatan = 0, humor = 0, kepercayaan = 0;
  let pilihanLog = [];

  // ---- SESSION TOKEN untuk membatalkan async yang sedang berjalan ----
  // Setiap kali ganti scene (klik MENU/ULANGI), token di-increment
  // Semua async loop akan cek apakah token masih sama; jika tidak, berhenti.
  let sessionToken = 0;

  // ---- AUDIO STATE ----
  let musicPlaying = false;
  let bgmAudioEl = null;          // HTMLAudioElement untuk Yiruma MP3
  let usingYiruma = false;        // true jika MP3 berhasil dimuat
  let audioCtx = null;            // untuk fallback Web Audio
  let masterGain = null;
  let loopTimeout = null;
  let activeNotes = [];

  // ---- KONFIGURASI ----
  const CONFIG = {
    delayBetweenBubbles: 1100,
    delayNarasi: 1500,
    typeSpeed: 45,
    delayAfterTyping: 450,
    typingIndicatorMin: 1500,
    typingIndicatorMax: 2800,
  };

  // ---- PATH FILE MP3 YIRUMA ----
  // Taruh file MP3 di folder yang sama dengan HTML ini, atau sesuaikan path.
  // Nama file harus persis: "Yiruma, (이루마) - River Flows in You - YIRUMA place 이루마 official (128k).mp3"
  const YIRUMA_FILENAME = "Yiruma, (이루마) - River Flows in You - YIRUMA place 이루마 official (128k).mp3";
  // Fallback: coba juga nama umum jika user simpan dengan nama berbeda
  const YIRUMA_FALLBACK_NAMES = [
    YIRUMA_FILENAME,
    "River Flows in You.mp3",
    "yiruma-river-flows-in-you.mp3",
    "river-flows-in-you.mp3"
  ];

  const displayArea = document.getElementById('display-area');
  const musicToggleBtn = document.getElementById('musicToggleBtn');
  const musicBars = document.getElementById('musicBars');
  const menuBtn = document.getElementById('menuBtn');
  const restartBtn = document.getElementById('restartBtn');
  const headerName = document.getElementById('headerName');
  const headerStatus = document.getElementById('headerStatus');
  const headerAvatar = document.getElementById('headerAvatar');

  // ============================================================
  //  AUDIO — YIRUMA MP3 DENGAN FALLBACK WEB AUDIO
  // ============================================================
  function initYirumaAudio() {
    if (bgmAudioEl) return bgmAudioEl;
    const audio = new Audio();
    audio.loop = true;
    audio.volume = 0.45;
    audio.preload = 'auto';

    // Coba beberapa nama file
    let tried = 0;
    const tryNext = () => {
      if (tried >= YIRUMA_FALLBACK_NAMES.length) {
        console.warn('File Yiruma MP3 tidak ditemukan. Menggunakan fallback Web Audio.');
        usingYiruma = false;
        initWebAudioFallback();
        return;
      }
      const name = YIRUMA_FALLBACK_NAMES[tried];
      audio.src = name;
      audio.load();
      tried++;
    };

    audio.addEventListener('canplaythrough', () => {
      usingYiruma = true;
      console.log('Yiruma MP3 berhasil dimuat:', audio.src);
    }, { once: true });

    audio.addEventListener('error', () => {
      // Coba nama berikutnya
      tryNext();
    });

    // Mulai percobaan pertama
    tryNext();

    bgmAudioEl = audio;
    return audio;
  }

  function initWebAudioFallback() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(audioCtx.destination);
    } catch (e) {
      console.warn('Web Audio tidak didukung:', e);
    }
  }

  function playPianoNote(freq, startTime, duration, volume) {
    if (!audioCtx || !masterGain) return;
    const t = startTime;
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = freq;
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 1.003;
    const osc3 = audioCtx.createOscillator();
    osc3.type = 'sine';
    osc3.frequency.value = freq * 2;

    const g1 = audioCtx.createGain();
    const g2 = audioCtx.createGain();
    const g3 = audioCtx.createGain();

    g1.gain.setValueAtTime(0, t);
    g1.gain.linearRampToValueAtTime(volume, t + 0.06);
    g1.gain.linearRampToValueAtTime(volume * 0.6, t + 0.4);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(volume * 0.5, t + 0.06);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    g3.gain.setValueAtTime(0, t);
    g3.gain.linearRampToValueAtTime(volume * 0.15, t + 0.06);
    g3.gain.exponentialRampToValueAtTime(0.0001, t + duration * 0.7);

    osc1.connect(g1); g1.connect(masterGain);
    osc2.connect(g2); g2.connect(masterGain);
    osc3.connect(g3); g3.connect(masterGain);

    osc1.start(t); osc2.start(t); osc3.start(t);
    osc1.stop(t + duration + 0.1);
    osc2.stop(t + duration + 0.1);
    osc3.stop(t + duration + 0.1);

    activeNotes.push(osc1, osc2, osc3);
    setTimeout(() => {
      [osc1, osc2, osc3].forEach(o => {
        const idx = activeNotes.indexOf(o);
        if (idx > -1) activeNotes.splice(idx, 1);
      });
    }, (duration + 0.3) * 1000);
  }

  const NOTE = {
    E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
    A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46
  };

  const MELODY = [
    { n: NOTE.A4, t: 0.0, d: 1.6, v: 0.14 }, { n: NOTE.C5, t: 1.6, d: 0.8, v: 0.12 },
    { n: NOTE.B4, t: 2.4, d: 1.0, v: 0.13 }, { n: NOTE.A4, t: 3.4, d: 1.4, v: 0.12 },
    { n: NOTE.F4, t: 4.8, d: 1.6, v: 0.14 }, { n: NOTE.A4, t: 6.4, d: 0.8, v: 0.12 },
    { n: NOTE.G4, t: 7.2, d: 1.0, v: 0.13 }, { n: NOTE.F4, t: 8.2, d: 1.4, v: 0.12 },
    { n: NOTE.E4, t: 9.6, d: 1.6, v: 0.14 }, { n: NOTE.G4, t: 11.2, d: 0.8, v: 0.12 },
    { n: NOTE.E4, t: 12.0, d: 1.0, v: 0.13 }, { n: NOTE.C4, t: 13.0, d: 1.4, v: 0.11 },
    { n: NOTE.D4, t: 14.4, d: 1.6, v: 0.13 }, { n: NOTE.G4, t: 16.0, d: 0.8, v: 0.12 },
    { n: NOTE.B4, t: 16.8, d: 1.0, v: 0.13 }, { n: NOTE.D5, t: 17.8, d: 1.6, v: 0.11 },
  ];

  const COUNTER_MELODY = [
    { n: NOTE.E5, t: 1.2, d: 1.0, v: 0.07 }, { n: NOTE.D5, t: 3.0, d: 1.0, v: 0.06 },
    { n: NOTE.C5, t: 6.0, d: 1.0, v: 0.07 }, { n: NOTE.A4, t: 7.8, d: 1.0, v: 0.06 },
    { n: NOTE.G4, t: 10.8, d: 1.0, v: 0.07 }, { n: NOTE.E4, t: 12.6, d: 1.0, v: 0.06 },
    { n: NOTE.B4, t: 15.6, d: 1.2, v: 0.07 }, { n: NOTE.A4, t: 17.4, d: 1.4, v: 0.06 },
  ];

  const CHORDS = [
    { n: NOTE.A3, t: 0.0, d: 2.2, v: 0.08 }, { n: NOTE.E4, t: 0.3, d: 2.2, v: 0.06 },
    { n: NOTE.A4, t: 0.6, d: 2.2, v: 0.05 },
    { n: NOTE.F3, t: 4.8, d: 2.2, v: 0.08 }, { n: NOTE.C4, t: 5.1, d: 2.2, v: 0.06 },
    { n: NOTE.F4, t: 5.4, d: 2.2, v: 0.05 },
    { n: NOTE.C4, t: 9.6, d: 2.2, v: 0.08 }, { n: NOTE.G4, t: 9.9, d: 2.2, v: 0.06 },
    { n: NOTE.E4, t: 10.2, d: 2.2, v: 0.05 },
    { n: NOTE.G3, t: 14.4, d: 2.2, v: 0.08 }, { n: NOTE.D4, t: 14.7, d: 2.2, v: 0.06 },
    { n: NOTE.B4, t: 15.0, d: 2.2, v: 0.05 },
  ];

  const LOOP_LENGTH = 19.4;

  function scheduleMusicFallback() {
    if (!audioCtx || !musicPlaying || usingYiruma) return;
    const now = audioCtx.currentTime;
    MELODY.forEach(n => playPianoNote(n.n, now + n.t, n.d, n.v));
    COUNTER_MELODY.forEach(n => playPianoNote(n.n, now + n.t, n.d, n.v));
    CHORDS.forEach(n => playPianoNote(n.n, now + n.t, n.d, n.v));
    loopTimeout = setTimeout(() => {
      if (musicPlaying && !usingYiruma) scheduleMusicFallback();
    }, LOOP_LENGTH * 1000);
  }

  function startMusic() {
    // Coba Yiruma dulu
    const audio = initYirumaAudio();

    // Tunggu sebentar agar event canplaythrough bisa jalan
    setTimeout(() => {
      if (usingYiruma && audio) {
        audio.volume = 0.45;
        const playPromise = audio.play();
        if (playPromise) {
          playPromise.catch(err => {
            console.warn('Gagal play Yiruma, fallback ke Web Audio:', err);
            usingYiruma = false;
            initWebAudioFallback();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            scheduleMusicFallback();
          });
        }
      } else {
        // Fallback Web Audio
        initWebAudioFallback();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        scheduleMusicFallback();
      }
    }, 300);

    musicPlaying = true;
    musicBars.classList.add('playing');
    musicToggleBtn.textContent = 'MUSIK ON';
  }

  function stopMusic() {
    musicPlaying = false;
    musicBars.classList.remove('playing');
    musicToggleBtn.textContent = 'MUSIK OFF';

    // Stop Yiruma
    if (bgmAudioEl) {
      try { bgmAudioEl.pause(); } catch(e){}
    }
    // Stop Web Audio
    if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
    if (masterGain && audioCtx) {
      try {
        masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
      } catch(e){}
    }
    setTimeout(() => {
      activeNotes.forEach(o => { try { o.stop(); } catch(e){} });
      activeNotes = [];
      if (masterGain && audioCtx) {
        try { masterGain.gain.value = 0.22; } catch(e){}
      }
    }, 450);
  }

  function toggleMusic() {
    if (musicPlaying) stopMusic();
    else startMusic();
  }

  function nowTime() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function setHeader(name, status, avatarLetter) {
    headerName.textContent = name;

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  // Cek apakah session masih valid
  function isSessionValid(token) {
    return token === sessionToken;
  }

  // ============================================================
  //  ANIMASI KETIK
  // ============================================================
  function typeText(element, text, speed, token) {
    return new Promise(resolve => {
      let i = 0;
      element.textContent = '';
      const caret = document.createElement('span');
      caret.className = 'typing-caret';
      element.appendChild(caret);

      const interval = setInterval(() => {
        // Cek token — kalau session berubah, batalkan animasi
        if (!isSessionValid(token)) {
          clearInterval(interval);
          try { caret.remove(); } catch(e){}
          resolve();
          return;
        }
        if (i < text.length) {
          caret.before(document.createTextNode(text[i]));
          i++;
          displayArea.scrollTop = displayArea.scrollHeight;
        } else {
          clearInterval(interval);
          try { caret.remove(); } catch(e){}
          resolve();
        }
      }, speed);
    });
  }

  async function addBubble(item, token) {
    if (!isSessionValid(token)) return;
    const div = document.createElement('div');

    if (item.type === 'chat') {
      div.className = 'chat-row ' + item.sender;
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + item.sender;

      const senderSpan = document.createElement('span');
      senderSpan.className = 'sender';
      senderSpan.textContent = item.sender === 'arka' ? 'Arka' : 'Nadia';
      bubble.appendChild(senderSpan);

      const textSpan = document.createElement('span');
      textSpan.className = 'text-content';
      bubble.appendChild(textSpan);

      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = item.time || nowTime();
      bubble.appendChild(timeSpan);

      div.appendChild(bubble);
      displayArea.appendChild(div);
      displayArea.scrollTop = displayArea.scrollHeight;

      await typeText(textSpan, item.text, CONFIG.typeSpeed, token);
      if (!isSessionValid(token)) return;
      await sleep(CONFIG.delayAfterTyping);
    } else if (item.type === 'narasi') {
      div.className = 'chat-row narasi';
      const bubble = document.createElement('div');
      bubble.className = 'bubble narasi';
      const textSpan = document.createElement('span');
      textSpan.className = 'text-content';
      bubble.appendChild(textSpan);
      div.appendChild(bubble);
      displayArea.appendChild(div);
      displayArea.scrollTop = displayArea.scrollHeight;

      await typeText(textSpan, item.text, CONFIG.typeSpeed * 0.85, token);
      if (!isSessionValid(token)) return;
      await sleep(CONFIG.delayAfterTyping + 300);
    } else if (item.type === 'timestamp') {
      div.className = 'chat-row timestamp';
      const badge = document.createElement('div');
      badge.className = 'timestamp-badge';
      badge.textContent = item.text;
      div.appendChild(badge);
      displayArea.appendChild(div);
      displayArea.scrollTop = displayArea.scrollHeight;
      await sleep(700);
    }
  }

    if (!isSessionValid(token)) return;
    return new Promise(resolve => {

  async function runScene(sceneId) {
    // BATALKAN SEMUA ASYNC SEBELUMNYA
    sessionToken++;
    const myToken = sessionToken;

    const scene = SCENES[sceneId];
    if (!scene) { console.warn('Scene tidak ditemukan:', sceneId); return; }

    // Kosongkan display
    displayArea.innerHTML = '';
    // Reset header status
    setHeaderTyping(false);

    if (scene.header) setHeader(scene.header.name, scene.header.status, scene.header.avatar);

    try {
      await scene.run(myToken);
    } catch (e) {
      console.error('Scene error:', e);
    }
  }

  // Proses array pesan dengan token validasi
  async function playMessages(messages, token) {
    for (let i = 0; i < messages.length; i++) {
      if (!isSessionValid(token)) return;
      const msg = messages[i];

      // Indikator mengetik untuk Nadia (kecuali pesan pertama)
      if (msg.type === 'chat' && msg.sender === 'nadia' && i > 0) {
        setHeaderTyping(true, 'Nadia');
        showTypingIndicator('nadia');
        const baseDur = Math.min(
          CONFIG.typingIndicatorMax,
          Math.max(CONFIG.typingIndicatorMin, msg.text.length * 30)
        );
        await sleep(baseDur);
        if (!isSessionValid(token)) return;
        hideTypingIndicator();
        setHeaderTyping(false);
      }

      await addBubble(msg, token);
      if (!isSessionValid(token)) return;

      // Jeda antar pesan
      if (i < messages.length - 1) {
        const next = messages[i + 1];
        let delay = CONFIG.delayBetweenBubbles;
        if (next.type === 'narasi' || msg.type === 'narasi') delay = CONFIG.delayNarasi;
        if (next.type === 'timestamp') delay = 500;
        await sleep(delay);
        if (!isSessionValid(token)) return;
      }
    }
  }

  // ============================================================
  //  INIT & TOMBOL
  // ============================================================
  function resetGame() {
    kedekatan = 0; humor = 0; kepercayaan = 0;
    pilihanLog = [];
    setHeader('Nadia', 'online', 'N');
    runScene('menu');
  }

  function init() {
    menuBtn.addEventListener('click', () => {
      stopMusic();
      resetGame();
    });
    restartBtn.addEventListener('click', () => {
      stopMusic();
      resetGame();
    });
    musicToggleBtn.addEventListener('click', toggleMusic);

    // Auto-start musik saat interaksi pertama
    const tryStart = () => {
      if (!musicPlaying) startMusic();
      document.removeEventListener('click', tryStart);
      document.removeEventListener('touchstart', tryStart);
    };
    document.addEventListener('click', tryStart);
    document.addEventListener('touchstart', tryStart);

    runScene('menu');
  }

  init();

})();
